# What about reimplementing the Coreutils in Rust ?

---

# What about the Coreutils ?

I have always been curious to see how it works.

--

I was inspired by the work on Clang.

--

Dropped in replacement for gcc. Missing flags are treated as bugs.

I helped when I started rebuilding Debian with https://clang.debian.net

--

<img src="clang-optim.png" />


---

# What is it?

About 105 commands in the GNU implementation.

Some of the less famous:

```bash
                     fold               printenv            tsort
                     groups    mknod    printf              tty
                                        ptx       stdbuf
                                                  stty      unexpand
basenc    dir        hostid             readlink
          dircolors                     realpath
chcon     dirname              nl       relpath   tac

                     join                                   vdir
                               numfmt   runcon
          expand     link      od
                               paste    shred
comm      factor     logname   pathchk
                               pinky
csplit    fmt                  pr                 truncate
```

# Why Rust rocks for this?

---

# Rust rocks for this? 1/2

--

1. Rust is replacing C in more and more places (Browsers, Kernel, OS, etc).

--

2. Rust rocks - security model, easy parallelism, terrific performances, etc...

--

3. It is NOT about security<br />
https://security-tracker.debian.org/tracker/source-package/coreutils<br />
Only 17 CVE in GNU/Coreutils since 2003

--

4. It is NOT about license (for me at least).<br />
Not interested by the MIT vs GPL debate.

---

# Rust rocks for this? 2/2

--

5. Very portable (like Java, write once, run everywhere ;) ).

--

6. Terrific ecosystem of crates (Rust libraries). `cargo add foo` is often enough to add a build dep.

--

7. As developer, it is very interesting.

--

8. For the new generations of hackers, Rust is more appealing.

--

* Has been supported by Sovereign Tech Fund in 2023 and Google summer of code 2024.


--

* Proper CI (and therefore build system) for most of the supported platforms

--

* Excellent code coverage -   Currently <b>87.80%</b>

--

* Lot of variations of job/compilations

--

* Upstream (GNU) contributions for bugs, test suites, etc

--

# We already started

We have been working on findutils and diffutils.

<img src="findutils.2.png" width="600" />

--

But I want to tell you about the big plan.

---

# Big plan

We want to do the same with most of the essential packages on Debian/Ubuntu.

There isn't a better time than now.

--

What are the essential packages?

```
$ dpkg-query -Wf '${Package;-40}${Essential}\n' | grep yes$
```

---

# The list

* procps: free, kill, ps, top, watch, ...

--

  pwdx, tload, slabtop, etc

--

* util-linux: dmesg, getopt, hardlink, lscpu, su, ...

--

  mcookie, choom, etc

--

* acl: getfacl, setfacl, ...

--

* bsdutils: renice, wall, logger, ...

--

* hostname: hostname, domainname, ...

--

* login: login, etc

---

# Status?

* All of these projects are already on
https://github.com/uutils/

--

* Reuses the infrastructure and code from coreutils (ex: our uucore libs)

--

* Some completed programs, some as POC, other not started.

--

* Easy to plug new tools

--

* Good first bugs for all projects to start with (new programs, missing options, compat issues, CI work, etc)
  Lot of low hanging fruits

An example with acl:
https://github.com/uutils/acl/issues?q=is:issue%20state:open%20label:%22good%20first%20issue%22
---

# Why do you think it will work?

* There is an appetite from the community.

--

* We need to pave the way for the young generation. C developers are probably going to be less common.

--

* We have reference implementations, it is "easy" to test.

--

* We are using modern contribution and pipelines.

--

* It is a bottom up community approach, no big tech behind it.
